<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 530" width="360" height="530" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="360" height="530" rx="14" fill="#f6f8fa"/>

  <!-- Console -->
  <rect x="95" y="16" width="170" height="56" rx="10" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="180" y="40" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Vantage Pro2</text>
  <text x="180" y="58" text-anchor="middle" font-size="12" fill="#57606a">console</text>

  <line x1="180" y1="72" x2="180" y2="100" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Logger -->
  <rect x="95" y="102" width="170" height="56" rx="10" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="180" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">WeatherLink</text>
  <text x="180" y="144" text-anchor="middle" font-size="12" fill="#57606a">USB logger</text>

  <line x1="180" y1="158" x2="180" y2="190" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="190" y="178" font-size="11" fill="#57606a">USB</text>

  <!-- ESP32-S3 -->
  <rect x="85" y="192" width="190" height="90" rx="12" fill="#1f3b57"/>
  <text x="180" y="222" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ESP32-S3</text>
  <text x="180" y="242" text-anchor="middle" font-size="12" fill="#cfe3ff">USB host + WiFi</text>
  <text x="180" y="266" text-anchor="middle" font-size="11" fill="#9fb4c6">web setup, /api/data</text>

  <!-- WiFi bus -->
  <line x1="180" y1="282" x2="180" y2="306" stroke="#6b7280" stroke-width="2"/>
  <text x="190" y="300" font-size="11" fill="#57606a">WiFi</text>
  <line x1="180" y1="306" x2="40" y2="306" stroke="#6b7280" stroke-width="2"/>
  <line x1="40" y1="306" x2="40" y2="493" stroke="#6b7280" stroke-width="2"/>
  <line x1="40" y1="349" x2="68" y2="349" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="40" y1="397" x2="68" y2="397" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="40" y1="445" x2="68" y2="445" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="40" y1="493" x2="68" y2="493" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Targets -->
  <rect x="70" y="330" width="260" height="38" rx="8" fill="#ffffff" stroke="#3c8d6e" stroke-width="1.5"/>
  <text x="200" y="354" text-anchor="middle" font-size="13" fill="#1f2328">Weather Underground</text>
  <rect x="70" y="378" width="260" height="38" rx="8" fill="#ffffff" stroke="#3c8d6e" stroke-width="1.5"/>
  <text x="200" y="402" text-anchor="middle" font-size="13" fill="#1f2328">Windy</text>
  <rect x="70" y="426" width="260" height="38" rx="8" fill="#ffffff" stroke="#3c8d6e" stroke-width="1.5"/>
  <text x="200" y="450" text-anchor="middle" font-size="13" fill="#1f2328">MQTT broker</text>
  <rect x="70" y="474" width="260" height="38" rx="8" fill="#ffffff" stroke="#3c8d6e" stroke-width="1.5"/>
  <text x="200" y="498" text-anchor="middle" font-size="13" fill="#1f2328">Your server (HTTP)</text>
</svg>
