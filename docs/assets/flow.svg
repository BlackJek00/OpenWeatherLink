<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="230" rx="14" fill="#f6f8fa"/>

  <!-- Console -->
  <rect x="20" y="78" width="130" height="64" rx="10" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="85" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Vantage Pro2</text>
  <text x="85" y="125" text-anchor="middle" font-size="12" fill="#57606a">console</text>

  <line x1="150" y1="110" x2="183" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Logger -->
  <rect x="185" y="78" width="130" height="64" rx="10" fill="#ffffff" stroke="#c9d3dd" stroke-width="1.5"/>
  <text x="250" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">WeatherLink</text>
  <text x="250" y="125" text-anchor="middle" font-size="12" fill="#57606a">USB logger</text>

  <line x1="315" y1="110" x2="358" y2="110" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="337" y="100" text-anchor="middle" font-size="11" fill="#57606a">USB</text>

  <!-- ESP32-S3 -->
  <rect x="360" y="70" width="140" height="80" rx="12" fill="#1f3b57"/>
  <text x="430" y="105" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">ESP32-S3</text>
  <text x="430" y="125" text-anchor="middle" font-size="12" fill="#cfe3ff">USB host + WiFi</text>
  <text x="430" y="172" text-anchor="middle" font-size="11" fill="#57606a">web setup, /api/data</text>

  <!-- WiFi bus -->
  <line x1="500" y1="110" x2="530" y2="110" stroke="#6b7280" stroke-width="2"/>
  <text x="515" y="102" text-anchor="middle" font-size="11" fill="#57606a">WiFi</text>
  <line x1="530" y1="42" x2="530" y2="192" stroke="#6b7280" stroke-width="2"/>
  <line x1="530" y1="42"  x2="558" y2="42"  stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="92"  x2="558" y2="92"  stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="142" x2="558" y2="142" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="192" x2="558" y2="192" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Targets -->
  <rect x="560" y="24"  width="180" height="36" rx="8" fill="#ffffff" stroke="#3c8d6e" stroke-width="1.5"/>
  <text x="650" y="47"  text-anchor="middle" font-size="13" fill="#1f2328">Weather Underground</text>
  <rect x="560" y="74"  width="180" height="36" rx="8" fill="#ffffff" stroke="#3c8d6e" stroke-width="1.5"/>
  <text x="650" y="97"  text-anchor="middle" font-size="13" fill="#1f2328">Windy</text>
  <rect x="560" y="124" width="180" height="36" rx="8" fill="#ffffff" stroke="#3c8d6e" stroke-width="1.5"/>
  <text x="650" y="147" text-anchor="middle" font-size="13" fill="#1f2328">MQTT broker</text>
  <rect x="560" y="174" width="180" height="36" rx="8" fill="#ffffff" stroke="#3c8d6e" stroke-width="1.5"/>
  <text x="650" y="197" text-anchor="middle" font-size="13" fill="#1f2328">Your server (HTTP)</text>
</svg>
